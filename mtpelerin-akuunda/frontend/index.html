<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: url("https://raw.githubusercontent.com/David-akuundapay/mtpelerin-akuunda/main/mtpelerin-akuunda/images/Business%20Card%20-%20Front.png")
                        no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 20px;
        }

        .hero-image {
            width: 100%;
            max-width: 420px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 15px;
            border: 5px solid #fff;
            box-shadow: 0 10px 30px rgba(57,22,89,.4);
        }

        iframe {
            width: 100%;
            height: 680px;
            border: none;
            border-radius: 20px;
            background: #fff;
        }

        .error-message {
            display: none;
            background: rgba(255,255,255,.9);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <img
        src="https://raw.githubusercontent.com/David-akuundapay/mtpelerin-akuunda/main/mtpelerin-akuunda/images/brand-hero.jpg"
        alt="Akuunda Pay"
        class="hero-image"
    >

    <div class="error-message" id="errorMessage">
        <h3>❌ Paramètre manquant</h3>
        <p>Le paramètre <b>tab</b> est obligatoire (ex: <code>?tab=buy</code>)</p>
    </div>

    <iframe id="widget"></iframe>

</div>

<script>
    // 🔐 Token Mt Pelerin (forcé)
    const API_TOKEN = "1c7a15d7-7243-4a77-a04e-c2b74061fa88";

    function getParams() {
        return Object.fromEntries(new URLSearchParams(window.location.search));
    }

    function buildWidgetURL(params) {
        // ✅ PARAMÈTRES AUTO-INJECTÉS (comme _ctkn)
        const finalParams = {
            _ctkn: API_TOKEN,
            _blgn: "1",          // ⚠️ lu uniquement à l'init (normal s’il disparaît)
            redir: "iban",       // ✅ persistant
            tabs: params.tab,   // buy / sell / swap
            lang: "fr"
        };

        return "https://widget.mtpelerin.com/?" +
            new URLSearchParams(finalParams).toString();
    }

    function init() {
        const params = getParams();

        if (!params.tab) {
            document.getElementById("errorMessage").style.display = "block";
            return;
        }

        const iframe = document.getElementById("widget");
        iframe.src = buildWidgetURL(params);
    }

    init();
</script>

</body>
</html>
