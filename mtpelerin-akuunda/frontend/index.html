<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Akuunda Pay - Crypto Widget</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer-when-downgrade">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f0f0f0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 450px; margin: 20px; }

        iframe {
            width: 100%; 
            height: 680px; 
            border: none; 
            border-radius: 15px; 
            background: white;
        }

        .loading, .error-message {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            display: none;
        }

        .error-message { color: #b00020; }
    </style>
</head>

<body>
<div class="container">

    <div class="loading" id="loadingMessage">
        <h2>Chargement...</h2>
        <p>Initialisation du widget Akuunda Pay</p>
    </div>

    <div class="error-message" id="errorMessage">
        <h2>Paramètres manquants</h2>
        <p>Veuillez vérifier les paramètres de l’URL.</p>
    </div>

    <div class="widget-container" id="widgetContainer" style="display:none;">
        <iframe id="widget" allow="usb; clipboard-write; payment;"></iframe>
    </div>

</div>

<script>
    const CONFIG = {
        BACKEND_URL: "https://mtpay.akuunda-pay.io/api/mtpelerin",
        API_TOKEN: "1c7a15d7-7243-4a77-a04e-c2b74061fa88"
    };

    /** Lire tous les paramètres URL sans filtrage */
    function parseUrlParameters() {
        const urlParams = new URLSearchParams(window.location.search);
        const params = {};
        for (const [key, value] of urlParams.entries()) {
            params[key] = value.trim();
        }
        return params;
    }

    /**
     * 🔥 Construction de l'URL Mt Pelerin
     * Rien n’est forcé : on reprend exactement ce que tu mets dans l’URL.
     */
    function formatWidgetUrl(params) {

        const base = {
            _ctkn: CONFIG.API_TOKEN,
            type: params.type || "direct-link",
            display: "direct"
        };

        // Copier tous les paramètres de l’URL
        Object.keys(params).forEach(key => {
            if (params[key] !== "" && params[key] !== undefined) {
                base[key] = params[key];
            }
        });

        // Si tab existe mais pas tabs → auto-ajouter tabs=tab
        if (params.tab && !params.tabs) {
            base.tabs = params.tab;
        }

        // Nettoyage final
        Object.keys(base).forEach(k => {
            if (base[k] === null || base[k] === undefined || base[k] === "") {
                delete base[k];
            }
        });

        const url = `https://widget.mtpelerin.com/?${new URLSearchParams(base).toString()}`;
        console.log("URL widget final :", url);

        return url;
    }

    function updateUI(state) {
        document.getElementById("errorMessage").style.display = "none";
        document.getElementById("loadingMessage").style.display = "none";
        document.getElementById("widgetContainer").style.display = "none";

        if (state === "error") document.getElementById("errorMessage").style.display = "block";
        if (state === "loading") document.getElementById("loadingMessage").style.display = "block";
        if (state === "loaded") document.getElementById("widgetContainer").style.display = "block";
    }

    function loadWidget(params) {
        updateUI("loading");

        const url = formatWidgetUrl(params);
        const iframe = document.getElementById("widget");

        iframe.onload = () => {
            updateUI("loaded");
        };

        iframe.onerror = () => {
            updateUI("error");
        };

        iframe.src = url;
    }

    function initializeApp() {
        const params = parseUrlParameters();

        // Si ni BUY ni SELL ni SWAP → erreur
        if (!params.tab) {
            return updateUI("error");
        }

        loadWidget(params);
    }

    document.addEventListener("DOMContentLoaded", initializeApp);
</script>

</body>
</html>
