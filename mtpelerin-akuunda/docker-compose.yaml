version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3100:80"  # Changé de 80:80 à 3001:80
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider"]
      interval: 30s
      timeout: 10s
      retries: 3
